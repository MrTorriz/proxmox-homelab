<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" font-family="'Cascadia Mono','Cascadia Code','JetBrains Mono','SF Mono',Menlo,monospace" role="img" aria-label="Proxmox homelab architecture: one host, two bridges, VPN gateway VM, passthrough workload VM">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="0.5"/>
    </pattern>
    <pattern id="gridFine" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#141414" stroke-width="0.3"/>
    </pattern>
    <linearGradient id="hostBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f5a623" stop-opacity="0.08"/>
      <stop offset="50%"  stop-color="#f5a623" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="edgeRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f5a623" stop-opacity="0.2"/>
      <stop offset="10%"  stop-color="#f5a623" stop-opacity="1.0"/>
      <stop offset="90%"  stop-color="#f5a623" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0.2"/>
    </linearGradient>
    <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#f5a623"/>
    </marker>
  </defs>

  <!-- BACKGROUND ===================================================== -->
  <rect width="1240" height="920" fill="#0d0d0d"/>
  <rect width="1240" height="920" fill="url(#gridFine)"/>
  <rect width="1240" height="920" fill="url(#grid)"/>

  <!-- TITLE BLOCK ==================================================== -->
  <text x="60" y="50" font-size="22" fill="#f5a623" font-weight="700" letter-spacing="2">PROXMOX</text>
  <text x="172" y="50" font-size="22" fill="#444" font-weight="300">/</text>
  <text x="190" y="50" font-size="22" fill="#e8e8e8" font-weight="300" letter-spacing="2">ARCHITECTURE</text>
  <text x="60" y="72" font-size="11" fill="#666" letter-spacing="1">PROXMOX VE 8 · 6 VMS · GPU + DISK PASSTHROUGH · ZERO INBOUND PORTS</text>

  <!-- corner registration marks (blueprint feel) -->
  <g stroke="#3a5a78" stroke-width="0.6" fill="none" stroke-opacity="0.4">
    <path d="M 30 30 L 30 50 M 30 30 L 50 30"/>
    <path d="M 1210 30 L 1210 50 M 1210 30 L 1190 30"/>
    <path d="M 30 890 L 30 870 M 30 890 L 50 890"/>
    <path d="M 1210 890 L 1210 870 M 1210 890 L 1190 890"/>
  </g>
  <text x="1200" y="50" font-size="9" fill="#3a5a78" text-anchor="end" letter-spacing="2">SHEET 02 / SCALE 1:1</text>

  <!-- ================================================================
       BAND 1 — INTERNET
       ================================================================ -->
  <text x="42" y="155" font-size="11" fill="#5a8fb8" letter-spacing="3" transform="rotate(-90,42,155)">INTERNET</text>
  <line x1="80" y1="100" x2="80" y2="190" stroke="#5a8fb8" stroke-width="0.8" stroke-opacity="0.5"/>

  <g stroke="#5a8fb8" stroke-width="1" fill="none">
    <rect x="405" y="115" width="220" height="46" rx="2"/>
    <rect x="785" y="115" width="220" height="46" rx="2"/>
  </g>
  <g font-size="11" fill="#e8e8e8" text-anchor="middle">
    <text x="515" y="135">Cloudflare edge</text>
    <text x="515" y="151" font-size="9" fill="#5a8fb8">public entry · zero forwards</text>
    <text x="895" y="135">Mullvad exit</text>
    <text x="895" y="151" font-size="9" fill="#5a8fb8">wireguard endpoints</text>
  </g>

  <!-- ================================================================
       EDGE RULE — heavy amber separator
       ================================================================ -->
  <line x1="60" y1="195" x2="1080" y2="195" stroke="url(#edgeRule)" stroke-width="3"/>
  <line x1="60" y1="201" x2="1080" y2="201" stroke="#f5a623" stroke-width="0.6" stroke-opacity="0.35"/>
  <text x="60" y="188" font-size="9" fill="#f5a623" letter-spacing="2">↑ EGRESS — TUNNELS ONLY</text>

  <!-- ================================================================
       BAND 2 — EDGE (ISP router)
       ================================================================ -->
  <text x="42" y="255" font-size="14" fill="#f5a623" letter-spacing="4" font-weight="700" transform="rotate(-90,42,255)">EDGE</text>
  <text x="60" y="255" font-size="9" fill="#8a5e1f" letter-spacing="2" transform="rotate(-90,60,255)">ISP ROUTER</text>

  <rect x="430" y="214" width="220" height="62" rx="3" fill="none" stroke="#f5a623" stroke-width="1.6"/>
  <line x1="440" y1="238" x2="640" y2="238" stroke="#f5a623" stroke-width="0.6" stroke-opacity="0.4"/>
  <g text-anchor="middle">
    <text x="540" y="232" font-size="12" fill="#f5a623" font-weight="600" letter-spacing="2">ISP ROUTER</text>
    <text x="540" y="256" font-size="11" fill="#e8e8e8">192.168.1.1</text>
    <text x="540" y="269" font-size="9" fill="#5a8fb8">no port-forwards · no DMZ</text>
  </g>

  <!-- router uplink + downlink -->
  <g stroke="#5a8fb8" stroke-width="0.8" stroke-opacity="0.5">
    <line x1="540" y1="161" x2="540" y2="214"/>
    <line x1="540" y1="276" x2="540" y2="360"/>
  </g>

  <!-- separator below EDGE -->
  <line x1="80" y1="305" x2="1080" y2="305" stroke="#5a8fb8" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- ================================================================
       BAND 3 — HOST (amber tint)
       ================================================================ -->
  <rect x="80" y="315" width="1000" height="385" fill="url(#hostBand)"/>
  <rect x="80" y="315" width="1000" height="385" fill="none" stroke="#f5a623" stroke-width="0.4" stroke-opacity="0.35"/>

  <text x="42" y="510" font-size="14" fill="#f5a623" letter-spacing="4" font-weight="700" transform="rotate(-90,42,510)">HOST</text>
  <text x="60" y="510" font-size="9" fill="#8a5e1f" letter-spacing="2" transform="rotate(-90,60,510)">PVE 8 · KVM/QEMU</text>

  <text x="180" y="337" font-size="10" fill="#aaa" letter-spacing="1">pve — bare metal · i5-9400F · 6 cores · 16 GB · headless</text>
  <text x="1030" y="337" font-size="10" fill="#5a8fb8" text-anchor="end">192.168.1.4</text>

  <!-- vmbr0 rail -->
  <text x="180" y="356" font-size="10" fill="#5a8fb8" letter-spacing="3" font-weight="600">VMBR0 — LAN BRIDGE</text>
  <line x1="180" y1="362" x2="1030" y2="362" stroke="#5a8fb8" stroke-width="0.6" stroke-opacity="0.5"/>
  <text x="1030" y="356" font-size="8" fill="#3a5a78" text-anchor="end">PHYSICAL NIC · 192.168.1.0/24</text>

  <!-- stubs vmbr0 → VMs -->
  <g stroke="#5a8fb8" stroke-width="0.8" stroke-opacity="0.5">
    <line x1="380" y1="362" x2="380" y2="385"/>
    <line x1="820" y1="362" x2="820" y2="385"/>
  </g>

  <!-- VM 100 -->
  <rect x="180" y="385" width="400" height="150" rx="3" fill="none" stroke="#5a8fb8" stroke-width="1"/>
  <line x1="190" y1="420" x2="570" y2="420" stroke="#5a8fb8" stroke-width="0.6" stroke-opacity="0.4"/>
  <g text-anchor="middle">
    <text x="380" y="411" font-size="12" fill="#e8e8e8" font-weight="600" letter-spacing="1">VM 100 — DOCKER-HOST</text>
    <text x="380" y="444" font-size="10" fill="#aaa">ubuntu 24.04 · 8 GB cap · always-on</text>
    <text x="380" y="464" font-size="10" fill="#e8e8e8">~40 containers — the homelab stack</text>
    <text x="380" y="484" font-size="9" fill="#f5a623">own mullvad client · lockdown mode</text>
    <text x="380" y="504" font-size="9" fill="#5a8fb8">rtx 2060 vfio · 2 × 4 tb raw · 192.168.1.5</text>
  </g>

  <!-- VM 105 vpn-gw -->
  <rect x="630" y="385" width="380" height="150" rx="3" fill="none" stroke="#f5a623" stroke-width="1.6"/>
  <line x1="640" y1="420" x2="1000" y2="420" stroke="#f5a623" stroke-width="0.6" stroke-opacity="0.4"/>
  <g text-anchor="middle">
    <text x="820" y="411" font-size="12" fill="#f5a623" font-weight="600" letter-spacing="2">VM 105 — VPN-GW</text>
    <text x="820" y="444" font-size="10" fill="#aaa">alpine · 512 MB · always-on</text>
    <text x="820" y="464" font-size="10" fill="#e8e8e8">wg0 — mullvad full tunnel</text>
    <text x="820" y="484" font-size="10" fill="#f5a623" font-weight="600">FORWARD policy DROP → fail-closed</text>
    <text x="820" y="504" font-size="9" fill="#5a8fb8">dnsmasq — dhcp + dns for the vpn lan</text>
  </g>

  <!-- stub vpn-gw → vmbr1 -->
  <line x1="820" y1="535" x2="820" y2="567" stroke="#f5a623" stroke-width="0.8" stroke-opacity="0.6"/>

  <!-- vmbr1 rail -->
  <text x="180" y="561" font-size="10" fill="#f5a623" letter-spacing="3" font-weight="600">VMBR1 — VPN LAN</text>
  <line x1="180" y1="567" x2="1030" y2="567" stroke="#f5a623" stroke-width="0.8" stroke-dasharray="4,3" stroke-opacity="0.7"/>
  <text x="1030" y="561" font-size="8" fill="#8a5e1f" text-anchor="end">10.10.10.0/24 · NO PHYSICAL PORT · ONLY EXIT = WG0</text>

  <!-- stubs vmbr1 → lab VMs -->
  <g stroke="#f5a623" stroke-width="0.6" stroke-dasharray="3,2" stroke-opacity="0.6">
    <line x1="275" y1="567" x2="275" y2="585"/>
    <line x1="495" y1="567" x2="495" y2="585"/>
    <line x1="715" y1="567" x2="715" y2="585"/>
    <line x1="935" y1="567" x2="935" y2="585"/>
  </g>

  <!-- lab VMs (VPN-isolated) -->
  <g fill="none" stroke="#f5a623" stroke-width="1.4" stroke-dasharray="4,2">
    <rect x="180" y="585" width="190" height="60" rx="2"/>
    <rect x="400" y="585" width="190" height="60" rx="2"/>
    <rect x="620" y="585" width="190" height="60" rx="2"/>
    <rect x="840" y="585" width="190" height="60" rx="2"/>
  </g>
  <g text-anchor="middle">
    <text x="275" y="608" font-size="11" fill="#e8e8e8" font-weight="600">WIN11</text>
    <text x="275" y="624" font-size="8" fill="#5a8fb8">vm 101 · 4 GB · ovmf + vtpm</text>
    <text x="275" y="638" font-size="8" fill="#666">on demand</text>
    <text x="495" y="608" font-size="11" fill="#e8e8e8" font-weight="600">KALI</text>
    <text x="495" y="624" font-size="8" fill="#5a8fb8">vm 102 · 4 GB · pentest lab</text>
    <text x="495" y="638" font-size="8" fill="#666">on demand</text>
    <text x="715" y="608" font-size="11" fill="#e8e8e8" font-weight="600">NIXOS</text>
    <text x="715" y="624" font-size="8" fill="#5a8fb8">vm 103 · 4 GB · flake playground</text>
    <text x="715" y="638" font-size="8" fill="#666">on demand</text>
    <text x="935" y="608" font-size="11" fill="#e8e8e8" font-weight="600">ARCH</text>
    <text x="935" y="624" font-size="8" fill="#5a8fb8">vm 104 · 4 GB · rolling lab</text>
    <text x="935" y="638" font-size="8" fill="#666">on demand</text>
  </g>

  <!-- separator before hardware -->
  <line x1="80" y1="708" x2="1080" y2="708" stroke="#5a8fb8" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- ================================================================
       BAND 4 — HARDWARE
       ================================================================ -->
  <text x="42" y="782" font-size="11" fill="#5a8fb8" letter-spacing="3" transform="rotate(-90,42,782)">HARDWARE</text>
  <line x1="80" y1="720" x2="80" y2="830" stroke="#5a8fb8" stroke-width="0.8" stroke-opacity="0.5"/>

  <g stroke="#5a8fb8" stroke-width="1" fill="none">
    <rect x="180" y="730" width="200" height="70" rx="2"/>
    <rect x="405" y="730" width="200" height="70" rx="2"/>
    <rect x="630" y="730" width="200" height="70" rx="2"/>
    <rect x="855" y="730" width="200" height="70" rx="2"/>
  </g>
  <g text-anchor="middle">
    <text x="280" y="755" font-size="11" fill="#e8e8e8" font-weight="600">NVMe 480 GB</text>
    <text x="280" y="773" font-size="9" fill="#5a8fb8">proxmox root · vm disks</text>
    <text x="280" y="787" font-size="9" fill="#5a8fb8">lvm-thin · discard=on</text>
    <text x="505" y="755" font-size="11" fill="#e8e8e8" font-weight="600">HDD 1 TB</text>
    <text x="505" y="773" font-size="9" fill="#5a8fb8">vzdump weekly · keep 3</text>
    <text x="505" y="787" font-size="9" fill="#5a8fb8">is_mountpoint=1</text>
    <text x="730" y="755" font-size="11" fill="#e8e8e8" font-weight="600">2 × 4 TB CMR</text>
    <text x="730" y="773" font-size="9" fill="#f5a623">raw passthrough → vm 100</text>
    <text x="730" y="787" font-size="9" fill="#5a8fb8">media + backup data</text>
    <text x="955" y="755" font-size="11" fill="#e8e8e8" font-weight="600">RTX 2060</text>
    <text x="955" y="773" font-size="9" fill="#f5a623">vfio passthrough → vm 100</text>
    <text x="955" y="787" font-size="9" fill="#5a8fb8">nvenc transcode · ml</text>
  </g>

  <!-- ================================================================
       WIREGUARD TUNNEL SIDOLINE — parallel right edge
       ================================================================ -->
  <g id="vpn">
    <line x1="1108" y1="100" x2="1108" y2="850" stroke="#f5a623" stroke-width="0.7" stroke-dasharray="3,3" stroke-opacity="0.55"/>
    <line x1="1172" y1="100" x2="1172" y2="850" stroke="#f5a623" stroke-width="0.7" stroke-dasharray="3,3" stroke-opacity="0.55"/>

    <text x="1140" y="475" font-size="11" fill="#f5a623" letter-spacing="6" font-weight="700" text-anchor="middle" transform="rotate(-90,1140,475)">WIREGUARD TUNNEL</text>
    <text x="1156" y="475" font-size="8" fill="#8a5e1f" letter-spacing="2" text-anchor="middle" transform="rotate(-90,1156,475)">WORKLOAD + LAB EGRESS</text>

    <!-- mullvad endpoint at top -->
    <rect x="1108" y="115" width="64" height="46" rx="2" fill="none" stroke="#f5a623" stroke-width="1"/>
    <text x="1140" y="134" font-size="9" fill="#f5a623" text-anchor="middle" font-weight="600">MULLVAD</text>
    <text x="1140" y="148" font-size="8" fill="#aaa" text-anchor="middle">wg0 peer</text>
    <text x="1140" y="158" font-size="7" fill="#5a8fb8" text-anchor="middle">full tunnel</text>

    <!-- killswitch box at bottom -->
    <rect x="1108" y="740" width="64" height="70" rx="2" fill="none" stroke="#f5a623" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="1140" y="762" font-size="9" fill="#f5a623" text-anchor="middle" font-weight="600">KILL-</text>
    <text x="1140" y="775" font-size="9" fill="#f5a623" text-anchor="middle" font-weight="600">SWITCH</text>
    <text x="1140" y="793" font-size="7" fill="#aaa" text-anchor="middle">FORWARD</text>
    <text x="1140" y="803" font-size="7" fill="#5a8fb8" text-anchor="middle">policy DROP</text>
  </g>

  <!-- ================================================================
       FLOW ARROWS — control plane (2px amber)
       ================================================================ -->
  <g stroke="#f5a623" stroke-width="2" fill="none">
    <!-- VM 100 → Cloudflare Tunnel (outbound ingress path) -->
    <path d="M 380 385 L 380 180 L 515 180 L 515 161" marker-end="url(#arrowAmber)"/>
  </g>
  <text x="372" y="250" font-size="8" fill="#f5a623" letter-spacing="1" transform="rotate(-90,372,250)">OUTBOUND TUNNEL</text>

  <!-- ================================================================
       VPN ARROWS — amber dashed, into the tunnel rail
       ================================================================ -->
  <g stroke="#f5a623" stroke-width="1.5" stroke-dasharray="5,2" fill="none">
    <!-- tunnel rail → mullvad exit (handshake) -->
    <path d="M 1108 138 L 1011 138" marker-end="url(#arrowAmber)" stroke-opacity="0.8"/>
    <!-- vpn-gw → tunnel rail -->
    <path d="M 1010 460 L 1102 460" marker-end="url(#arrowAmber)"/>
    <!-- VM 100 own client → tunnel rail (routed under the lab row) -->
    <path d="M 580 512 L 605 512 L 605 690 L 1102 690" marker-end="url(#arrowAmber)"/>
  </g>
  <text x="1056" y="130" font-size="8" fill="#f5a623" text-anchor="middle" letter-spacing="1">handshake</text>
  <text x="1056" y="452" font-size="8" fill="#f5a623" text-anchor="middle" letter-spacing="1">lab egress</text>
  <text x="860" y="682" font-size="8" fill="#f5a623" text-anchor="middle" letter-spacing="1">workload egress · lockdown</text>

  <!-- ================================================================
       LEGEND
       ================================================================ -->
  <g id="legend" transform="translate(60, 870)">
    <text x="0" y="0" font-size="9" fill="#666" letter-spacing="3">LEGEND</text>

    <line x1="0" y1="20" x2="34" y2="20" stroke="#f5a623" stroke-width="2"/>
    <text x="42" y="24" font-size="9" fill="#aaa">encrypted egress</text>

    <line x1="180" y1="20" x2="214" y2="20" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="5,2"/>
    <text x="222" y="24" font-size="9" fill="#aaa">wireguard flow</text>

    <rect x="350" y="13" width="14" height="14" fill="none" stroke="#5a8fb8" stroke-width="1"/>
    <text x="370" y="24" font-size="9" fill="#aaa">vm / hardware</text>

    <rect x="490" y="13" width="14" height="14" fill="none" stroke="#f5a623" stroke-width="1.5"/>
    <text x="510" y="24" font-size="9" fill="#aaa">vpn / edge component</text>

    <rect x="670" y="13" width="14" height="14" fill="none" stroke="#f5a623" stroke-width="1.4" stroke-dasharray="4,2"/>
    <text x="690" y="24" font-size="9" fill="#aaa">vpn-isolated vm</text>

    <text x="1020" y="24" font-size="9" fill="#3a5a78" text-anchor="end">0 open inbound ports</text>
  </g>

</svg>
