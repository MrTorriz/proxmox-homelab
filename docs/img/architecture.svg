<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-label="Proxmox homelab architecture: one host, two bridges, VPN gateway VM, passthrough workload VM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090e1c"/>
      <stop offset="1" stop-color="#0e1526"/>
    </linearGradient>
    <linearGradient id="hostfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a30"/>
      <stop offset="1" stop-color="#0d1628"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ffd524"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e8eefb; }
    .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; }
    .muted { fill: #8593b3; }
    .dim { fill: #5c6a8c; }
    .accent { fill: #f2a25c; }
    .teal { fill: #6fe3d0; }
    .yellow { fill: #ffd524; }
    .green { fill: #4ade80; }
    .h1 { font-size: 16px; font-weight: 600; }
    .h2 { font-size: 15px; font-weight: 600; }
    .body { font-size: 12.5px; }
    .small { font-size: 11px; }
    .tiny { font-size: 10.5px; }
    .wire { stroke: #4a5a80; stroke-width: 1.6; fill: none; }
    .vpnwire { stroke: #ffd524; stroke-width: 1.8; fill: none; stroke-dasharray: 7 5; opacity: .9; }
  </style>

  <rect x="0" y="0" width="1200" height="840" rx="18" fill="url(#bg)"/>
  <text x="42" y="52" class="tiny dim" style="letter-spacing:3px">PROXMOX HOMELAB</text>
  <text x="42" y="68" class="tiny dim" style="letter-spacing:3px">ARCHITECTURE</text>

  <!-- Internet -->
  <rect x="300" y="28" width="600" height="56" rx="28" fill="#161f36" stroke="#3c4a6e" stroke-width="1.5" filter="url(#soft)"/>
  <text x="600" y="53" text-anchor="middle" class="h1" style="letter-spacing:5px">INTERNET</text>
  <text x="600" y="72" text-anchor="middle" class="small muted">all egress encrypted — WireGuard to Mullvad · Cloudflare Tunnel</text>

  <!-- Router -->
  <line x1="600" y1="84" x2="600" y2="124" class="wire"/>
  <rect x="480" y="124" width="240" height="50" rx="10" fill="#141d33" stroke="#3c4a6e" stroke-width="1.5" filter="url(#soft)"/>
  <text x="600" y="145" text-anchor="middle" class="body" style="font-weight:600">ISP router</text>
  <text x="600" y="163" text-anchor="middle" class="small mono muted">192.168.1.1</text>
  <line x1="600" y1="174" x2="600" y2="282" class="wire"/>

  <!-- Host box -->
  <rect x="40" y="214" width="1120" height="520" rx="16" fill="url(#hostfill)" stroke="#e57000" stroke-width="2"/>
  <text x="64" y="248" class="h1 accent">Proxmox VE — “pve”</text>
  <text x="64" y="268" class="small muted">bare metal · i5-9400F · 6 cores · 16 GB · headless</text>
  <text x="1136" y="248" text-anchor="end" class="small mono muted">192.168.1.4</text>

  <!-- Encrypted egress curves (behind bridges and boxes) -->
  <path d="M 340 352 C 340 240, 410 120, 468 88" class="vpnwire" marker-end="url(#arrY)"/>
  <path d="M 820 352 C 820 250, 760 130, 726 88" class="vpnwire" marker-end="url(#arrY)"/>

  <!-- vmbr0 -->
  <rect x="80" y="282" width="1040" height="28" rx="7" fill="#223052"/>
  <text x="600" y="300" text-anchor="middle" class="small" fill="#a9bdea">vmbr0 — LAN bridge · physical NIC · 192.168.1.0/24</text>

  <!-- VM 100 -->
  <line x1="250" y1="310" x2="250" y2="352" class="wire"/>
  <rect x="80" y="352" width="430" height="240" rx="12" fill="#16233f" stroke="#5b8bfa" stroke-width="1.6" filter="url(#soft)"/>
  <text x="100" y="384" class="h2">VM 100 — docker-host</text>
  <circle cx="419" cy="380" r="3.5" class="green" fill="#4ade80"/>
  <text x="430" y="384" class="small green">always-on</text>
  <text x="100" y="410" class="body">Ubuntu 24.04 · 8 GB cap — the homelab stack</text>
  <text x="100" y="430" class="body muted">~45 containers: media · photos · DNS · proxy</text>
  <text x="100" y="450" class="body muted">own Mullvad client, lockdown mode</text>
  <rect x="100" y="470" width="190" height="46" rx="9" fill="#0c1526" stroke="#2b3a5c"/>
  <text x="195" y="489" text-anchor="middle" class="small" style="font-weight:600">RTX 2060</text>
  <text x="195" y="505" text-anchor="middle" class="tiny muted">vfio GPU passthrough</text>
  <rect x="300" y="470" width="190" height="46" rx="9" fill="#0c1526" stroke="#2b3a5c"/>
  <text x="395" y="489" text-anchor="middle" class="small" style="font-weight:600">2 × 4 TB HDD</text>
  <text x="395" y="505" text-anchor="middle" class="tiny muted">raw disk passthrough</text>
  <text x="100" y="574" class="small mono muted">192.168.1.5</text>

  <!-- vpn-gw -->
  <line x1="700" y1="310" x2="700" y2="352" class="wire"/>
  <rect x="560" y="352" width="400" height="150" rx="12" fill="#1f2412" stroke="#e3c53d" stroke-width="1.6" filter="url(#soft)"/>
  <text x="580" y="384" class="h2">VM 105 — vpn-gw</text>
  <circle cx="869" cy="380" r="3.5" fill="#4ade80"/>
  <text x="880" y="384" class="small green">always-on</text>
  <text x="580" y="410" class="body">Alpine router · 512 MB · full Mullvad tunnel</text>
  <rect x="580" y="424" width="310" height="28" rx="8" fill="#2a2408" stroke="#8a7a1e"/>
  <text x="735" y="442" text-anchor="middle" class="small mono yellow">FORWARD policy: DROP → fail-closed</text>
  <text x="580" y="478" class="body muted">dnsmasq — DHCP + in-tunnel DNS for VPN LAN</text>
  <line x1="760" y1="502" x2="760" y2="530" class="wire"/>

  <!-- vmbr1 -->
  <rect x="560" y="530" width="560" height="28" rx="7" fill="#0e3d38"/>
  <text x="840" y="548" text-anchor="middle" class="small teal">vmbr1 — VPN LAN 10.10.10.0/24 · only exit is wg0</text>

  <!-- Lab VMs -->
  <g>
    <line x1="624" y1="558" x2="624" y2="592" class="wire"/>
    <rect x="560" y="592" width="128" height="96" rx="10" fill="#12242b" stroke="#24565f" filter="url(#soft)"/>
    <text x="624" y="618" text-anchor="middle" class="body" style="font-weight:600">win11</text>
    <text x="624" y="637" text-anchor="middle" class="tiny muted">VM 101 · 4 GB</text>
    <text x="624" y="654" text-anchor="middle" class="tiny muted">OVMF + vTPM</text>
    <text x="624" y="671" text-anchor="middle" class="tiny dim">on demand</text>
  </g>
  <g>
    <line x1="768" y1="558" x2="768" y2="592" class="wire"/>
    <rect x="704" y="592" width="128" height="96" rx="10" fill="#12242b" stroke="#24565f" filter="url(#soft)"/>
    <text x="768" y="618" text-anchor="middle" class="body" style="font-weight:600">kali</text>
    <text x="768" y="637" text-anchor="middle" class="tiny muted">VM 102 · 4 GB</text>
    <text x="768" y="654" text-anchor="middle" class="tiny muted">pentest lab</text>
    <text x="768" y="671" text-anchor="middle" class="tiny dim">on demand</text>
  </g>
  <g>
    <line x1="912" y1="558" x2="912" y2="592" class="wire"/>
    <rect x="848" y="592" width="128" height="96" rx="10" fill="#12242b" stroke="#24565f" filter="url(#soft)"/>
    <text x="912" y="618" text-anchor="middle" class="body" style="font-weight:600">nixos</text>
    <text x="912" y="637" text-anchor="middle" class="tiny muted">VM 103 · 4 GB</text>
    <text x="912" y="654" text-anchor="middle" class="tiny muted">flake playground</text>
    <text x="912" y="671" text-anchor="middle" class="tiny dim">on demand</text>
  </g>
  <g>
    <line x1="1056" y1="558" x2="1056" y2="592" class="wire"/>
    <rect x="992" y="592" width="128" height="96" rx="10" fill="#12242b" stroke="#24565f" filter="url(#soft)"/>
    <text x="1056" y="618" text-anchor="middle" class="body" style="font-weight:600">arch</text>
    <text x="1056" y="637" text-anchor="middle" class="tiny muted">VM 104 · 4 GB</text>
    <text x="1056" y="654" text-anchor="middle" class="tiny muted">rolling lab</text>
    <text x="1056" y="671" text-anchor="middle" class="tiny dim">on demand</text>
  </g>

  <!-- Host storage -->
  <text x="80" y="634" class="tiny dim" style="letter-spacing:2.5px">HOST STORAGE</text>
  <rect x="80" y="644" width="205" height="60" rx="9" fill="#0c1526" stroke="#2b3a5c"/>
  <text x="182" y="668" text-anchor="middle" class="small" style="font-weight:600">NVMe 480 GB</text>
  <text x="182" y="686" text-anchor="middle" class="tiny muted">Proxmox root + VM disks</text>
  <rect x="305" y="644" width="205" height="60" rx="9" fill="#0c1526" stroke="#2b3a5c"/>
  <text x="407" y="668" text-anchor="middle" class="small" style="font-weight:600">HDD 1 TB</text>
  <text x="407" y="686" text-anchor="middle" class="tiny muted">vzdump weekly · keep 3</text>

  <!-- Legend -->
  <line x1="80" y1="788" x2="120" y2="788" class="vpnwire"/>
  <text x="130" y="792" class="small muted">encrypted WireGuard egress</text>
  <line x1="330" y1="788" x2="370" y2="788" class="wire"/>
  <text x="380" y="792" class="small muted">LAN / bridge link</text>
  <text x="1136" y="792" text-anchor="end" class="small muted">0 open inbound ports — external access via outbound tunnels only</text>
</svg>
